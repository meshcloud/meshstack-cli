plugins {
  id 'io.meshcloud.meshstack.go-satellite'
}

satellite {
  acceptance {
    run = 'TestAcc'
    // Without MESHSTACK_TESTACC every test in cmd/internal/testacc skips, and the suite passes
    // without a backend. The second one keeps the browser login from launching a browser on the
    // agent; internal/oidc/browser reads it straight from the environment.
    environment MESHSTACK_TESTACC: '1',
                MESHSTACK_CLI_NO_BROWSER: '1'
  }
}
