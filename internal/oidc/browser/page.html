<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meshStack CLI</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f8f9fa; color: #212529; font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { box-sizing: border-box; width: min(28rem, 100% - 2rem); padding: 2rem; background: #fff;
    border: 1px solid #dee2e6; border-radius: .5rem; }
  header { display: flex; align-items: center; gap: .5rem; margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 600; }
  header img { height: 2.5rem; }
  h1 { font-size: 1.125rem; margin: 0 0 .5rem; }
  label { display: flex; gap: .75rem; padding: .75rem; margin-bottom: .5rem; border: 1px solid #dee2e6; border-radius: .375rem; cursor: pointer; }
  label:has(input:checked) { border-color: #0d6efd; background: #e7f1ff; }
  .detail { display: block; color: #6c757d; font-size: .875rem; }
  .recommendation { font-size: .75rem; }
  .help { position: relative; margin-left: .25rem; cursor: help; }
  .help img { height: 1em; vertical-align: -.125em; }
  .help::after { content: attr(data-help); position: absolute; z-index: 1; bottom: calc(100% + .5rem); left: 50%;
    transform: translateX(-50%); width: max-content; max-width: 16rem; padding: 1rem; background: #fff; color: #212529;
    border: 1px solid rgba(0, 0, 0, .175); border-radius: .5rem; box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15); }
  .help::before { content: ""; position: absolute; z-index: 2; bottom: calc(100% + .5rem - .3125rem); left: 50%;
    width: .625rem; height: .625rem; transform: translateX(-50%) rotate(45deg); background: #fff;
    border: solid rgba(0, 0, 0, .175); border-width: 0 1px 1px 0; }
  .help::before, .help::after { display: none; }
  .help:hover::before, .help:hover::after, .help:focus::before, .help:focus::after { display: block; }
  code { padding: .125rem .375rem; background: #f1f3f5; border: 1px solid #dee2e6; border-radius: .25rem;
    font: .875em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  .error { color: #dc3545; }
  button { width: 100%; margin-top: 1rem; padding: .5rem; border: 0; border-radius: .375rem;
    background: #0d6efd; color: #fff; font: inherit; cursor: pointer; }
  button:hover { background: #0b5ed7; }
</style>
</head>
<body>
<main>
  <header><img src="{{.Logo}}" alt="">meshStack CLI</header>
  <h1>{{.Title}}</h1>
  {{- with .Endpoint}}
  <p>This login is for <code>{{.}}</code>.</p>
  {{- end}}
  {{- with .AccessLevel}}
  <p>Access level: <strong>{{.}}</strong></p>
  {{- end}}
  <p{{if .Failed}} class="error"{{end}}>{{.Message}}</p>
  {{- with .Form}}
  <form method="post" action="/">
    <input type="hidden" name="nonce" value="{{.Nonce}}">
    {{- range .Levels}}
    <label><input type="radio" name="access" value="{{.Value}}" required{{if .Selected}} checked{{end}}>
      <div><strong>{{.Label}}</strong>
        <span class="detail">{{.Detail}}{{with .DetailHelp}}<span class="help" tabindex="0" role="img" aria-label="{{.}}" data-help="{{.}}"><img src="{{$.HelpIcon}}" alt=""></span>{{end}}</span>
        {{- with .Recommendation}}
        <span class="detail recommendation">{{.}}</span>
        {{- end}}</div></label>
    {{- end}}
    <button type="submit">Continue to log in</button>
  </form>
  {{- end}}
</main>
</body>
</html>
