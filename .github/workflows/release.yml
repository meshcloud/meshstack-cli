name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser creates the release and uploads the archives
      pull-requests: read # The release notes take their entries from the pull request descriptions.
      issues: read # The release notes name the issues that a pull request closed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser and the release notes need the older tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Write the release notes
        run: nix develop -c go run ./tools/releaser "$(git describe --tags --abbrev=0 HEAD^)..HEAD" > "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        run: nix develop -c goreleaser release --clean --release-notes "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The winget section of .goreleaser.yml says how to set up this secret.
          JANNYMESHI_WINGET_PKGS_TOKEN: ${{ secrets.JANNYMESHI_WINGET_PKGS_TOKEN }} # zizmor: ignore[secrets-outside-env] a repository secret that belongs to no environment

      # goreleaser only logs a failed winget pull request and still succeeds, so this step fails
      # the job instead. The branch name must match winget.repository.branch in .goreleaser.yml.
      # --head reads the pull requests directly; --author would go through the search API, which
      # can miss a pull request that is only seconds old.
      - name: Check the winget pull request
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="meshstack-cli-${TAG#v}"
          url=$(gh pr list --repo microsoft/winget-pkgs --head "$branch" --state all --json author,url \
            --jq '.[] | select(.author.login == "jannymeshi") | .url')
          if [ -z "$url" ]; then
            echo "::error::found no pull request from jannymeshi:$branch in microsoft/winget-pkgs; see the winget step of goreleaser above"
            exit 1
          fi
          echo "winget pull request: $url"

  # Publishes the image for the same tag. Separate job so a failing image build does
  # not take the archives down with it.
  image:
    name: Image
    needs: [ goreleaser ]
    permissions:
      contents: read
      packages: write # build-image.yml pushes the image to GHCR
    uses: ./.github/workflows/build-image.yml # zizmor: ignore[self-repository] no release has tried the $/ form
    with:
      version: ${{ github.ref_name }}

  # Separate job for the same reason as the image.
  homebrew:
    name: Homebrew
    needs: [ goreleaser ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint a token for the tap
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }} # zizmor: ignore[secrets-outside-env] a repository secret that belongs to no environment
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] a repository secret that belongs to no environment
          owner: meshcloud
          repositories: homebrew-tap
          permission-contents: write

      - name: Push the formula to the tap
        env:
          # Read through the environment, for the same reason as in build-image.yml.
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          gh release download "$TAG" --pattern '*_SHA256SUMS' --dir "$RUNNER_TEMP/release"

          tap="$RUNNER_TEMP/tap"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/meshcloud/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          .github/homebrew/formula.sh "$TAG" "$RUNNER_TEMP"/release/*_SHA256SUMS > "$tap/Formula/meshstack-cli.rb"

          # Committed as the app's bot user, which is how GitHub attributes a commit to an app.
          bot="${APP_SLUG}[bot]"
          git -C "$tap" config user.name "$bot"
          git -C "$tap" config user.email "$(gh api "/users/${bot}" --jq .id)+${bot}@users.noreply.github.com"

          git -C "$tap" add Formula/meshstack-cli.rb
          # A re-run of this job for the same tag finds nothing to commit.
          if git -C "$tap" diff --cached --quiet; then
            exit 0
          fi
          git -C "$tap" commit -m "meshstack-cli ${TAG#v}"
          git -C "$tap" push origin HEAD:main
