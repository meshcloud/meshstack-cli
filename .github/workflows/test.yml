name: Tests

# No `paths-ignore` on either trigger, deliberately: a workflow skipped that way never reports its
# checks, so a required check on it stays "expected" forever and blocks the merge. A skipped *job*
# reports success; a skipped *workflow* does not.
#
# dependabot-vendor-hash.yml dispatches this for the commit it pushes.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      - run: nix develop -c task tidy
      - run: nix develop -c go build -v ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after 'go mod tidy'. Run 'go mod tidy' command and commit."; exit 1)

  golangci:
    needs: [ build ]
    name: Go Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      - run: nix develop -c task lint
      - name: Suggest fix command on failure
        if: failure()
        run: |
          echo "::error::Linting or formatting issues detected. Run 'task lint -- --fix' locally to automatically fix these issues, then commit the changes."

  zizmor:
    name: Workflow Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix develop -c zizmor --offline --persona=auditor --format=github .

  govulncheck:
    needs: [ build ]
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      - run: nix develop -c task vuln

  test:
    name: Go Test
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      # Binary coverage data (GOCOVERDIR format) rather than a text profile, because only the
      # binary form merges with the acceptance run's coverage. `-coverpkg=./...` has to match what
      # meshfed-release runs the acceptance suite with, or the merged figure is a ratio over two
      # different denominators.
      - name: Run unit tests with gotestsum
        run: |
          mkdir -p covdata/unit
          nix develop -c go tool gotestsum --junitfile junit.xml --format testdox -- \
            -coverpkg=./... ./... -args -test.gocoverdir="$PWD/covdata/unit"

      # meshfed-release finds this by the pull request head sha, so it has to be uploaded from a run
      # on that commit: a `pull_request` run, or the dispatch of dependabot-vendor-hash.yml. The
      # contract with that side is the artifact name `covdata-unit` and covmeta.*/covcounters.* at
      # its root, which naming the directory gives and a glob would nest.
      - name: Upload unit coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covdata-unit
          path: covdata/unit
          retention-days: 3

      - name: Report unit coverage
        if: always()
        run: |
          if ! ls covdata/unit/covmeta.* >/dev/null 2>&1; then
            echo "Unit coverage: no data produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          nix develop -c go tool covdata textfmt -i=covdata/unit -o=unit.txt
          echo "Unit coverage: $(nix develop -c go tool cover -func=unit.txt | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
