# meshStack CLI build, lint and test workflow.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod tidy
      - run: go build -v ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after 'go mod tidy'. Run 'go mod tidy' command and commit."; exit 1)

  golangci:
    needs: [ build ]
    name: Go Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The repository's pinned Go, because it is what builds the linter below.
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # golangci-lint's formatters use the go/format compiled into the binary, so the
          # formatting they enforce comes from the Go release that BUILT the linter, not
          # from the toolchain on PATH. The published binaries are built with whatever Go
          # was current at release time, which made 'version: latest' with install-mode
          # 'binary' enforce a different gofmt than the pinned Go: 1.27 widens end-of-line
          # comment alignment groups, and 1.26 rejected the result, so the two disagreed
          # with no formatting that satisfies both. Building the linter here with go.mod's
          # Go ties formatting to the version the code is written against.
          #
          # The version tracks what nixpkgs-unstable packages, because that is the binary a
          # developer gets from flake.nix, and it must be one that supports the pinned Go:
          # v2.13.0 is where golangci-lint added Go 1.27, and nixpkgs builds v2.13.1 with
          # Go 1.27 too.
          install-mode: goinstall
          version: v2.13.1
          # Deliberately no only-new-issues: this repository starts clean and CI keeps it
          # that way, so filtering to changed code cannot help and can only hide a finding.
          # It hid this one, and still hides it in the provider's identical job.
      - name: Suggest fix command on failure
        if: failure()
        run: |
          echo "::error::Linting or formatting issues detected. Run 'task lint -- --fix' locally to automatically fix these issues, then commit the changes."

  shellcheck:
    name: Shell Lint (CI scripts)
    # No `needs`: it shares nothing with the Go build, and the acceptance workflow that runs these
    # scripts is skipped on forks — so this job is the only gate a fork's PR gets on them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # shellcheck ships in the ubuntu-latest image, so no install step is needed.
      - run: shellcheck .github/scripts/*.sh

  test:
    needs: [ build ]
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go test -v ./...
