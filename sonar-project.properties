sonar.projectKey=meshcloud_meshstack-cli
sonar.organization=meshcloud

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go,\
  internal/testutil/**,\
  internal/setting/setting_test/**
# A file is either source or test, so the sources exclude the test patterns.
sonar.exclusions=\
  **/*_test.go,\
  internal/testutil/**,\
  internal/setting/setting_test/**,\
  **/testdata/**,\
  **/*.gif

# The coverage report holds Go only.
sonar.coverage.exclusions=\
  **/*.sh,\
  **/*.ps1

# Every command group declares the same cobra skeleton.
sonar.cpd.exclusions=\
  cmd/buildingblock/buildingblock.go,\
  cmd/buildingblockdefinition/buildingblockdefinition.go,\
  cmd/buildingblockdefinitionversion/buildingblockdefinitionversion.go,\
  cmd/buildingblockrun/buildingblockrun.go,\
  cmd/eventlog/eventlog.go,\
  cmd/workspace/workspace.go

# Terraform here is test data and the repository settings in infra/github.
sonar.terraform.activate=false

# Cognitive complexity (S3776) and duplicated string literals (S1192) are accepted.
# install.sh is POSIX sh, which has no `local` (S7679).
sonar.issue.ignore.multicriteria=goS3776,goS1192,shellS1192,powershellS3776,githubactionsS1192,dockerS1192,installS7679
sonar.issue.ignore.multicriteria.goS3776.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.goS3776.resourceKey=**/*
sonar.issue.ignore.multicriteria.goS1192.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.goS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.shellS1192.ruleKey=shell:S1192
sonar.issue.ignore.multicriteria.shellS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.powershellS3776.ruleKey=powershelldre:S3776
sonar.issue.ignore.multicriteria.powershellS3776.resourceKey=**/*
sonar.issue.ignore.multicriteria.githubactionsS1192.ruleKey=githubactions:S1192
sonar.issue.ignore.multicriteria.githubactionsS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.dockerS1192.ruleKey=docker:S1192
sonar.issue.ignore.multicriteria.dockerS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.installS7679.ruleKey=shell:S7679
sonar.issue.ignore.multicriteria.installS7679.resourceKey=install.sh
