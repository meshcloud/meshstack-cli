# Kept deliberately close to the meshStack Terraform provider's configuration, so
# that code moving between the two repositories does not trip a different linter set.
version: "2"
issues:
  max-same-issues: 0

formatters:
  enable:
    - gci
    # gofumpt rather than gofmt: a strict superset, so there is nothing left to argue about.
    - gofumpt
  settings:
    gci:
      sections:
        - standard     # Go standard library
        - default      # All other external dependencies
        - localmodule  # This repository's modules

linters:
  # Every linter, minus the list below, so a new release's checks arrive on and a rejection is a
  # line here with a reason. Visit https://golangci-lint.run/ for what each linter does.
  default: all
  disable:
    # Broken or superseded
    - exhaustruct_v5   # panics on this codebase with exhaustruct v5.0.3
    - exhaustruct      # deprecated, superseded by exhaustruct_v5
    - wsl              # deprecated, superseded by wsl_v5
    - gomodguard       # deprecated, superseded by gomodguard_v2

    # Layout, which gofumpt and gci already settle
    - wsl_v5
    - nlreturn
    - tagalign
    - lll
    - decorder
    - grouper
    - goheader

    # Styles this repository chose on purpose
    - nakedret         # a named result returned bare documents itself at the signature
    - nonamedreturns   # so a named result stays
    - noinlineerr      # `if err := f(); err != nil` is the house style
    - varnamelen       # a short receiver or loop name is idiomatic
    - godox            # a TODO comment is a deliberate marker
    - gochecknoglobals # a setting is declared once, as a package-level var
    - gochecknoinits   # credential checks its names against the fields of Credentials at init
    - ireturn          # a constructor returning an interface is the client's shape
    - testpackage      # an in-package test is a deliberate choice
    - dupl             # the binding clients are parallel by design
    - tagliatelle      # OIDC and OAuth field names are snake_case by spec
    - paralleltest     # t.Setenv forbids t.Parallel

    # Error plumbing we decide case by case
    - wrapcheck
    - err113

    # Measurements, not goals
    - funlen
    - cyclop
    - gocyclo
    - gocognit
    - maintidx
    - nestif
    - mnd
    - goconst
    - prealloc
    - dogsled
    - interfacebloat

  exclusions:
    rules:
      # A doc comment is required in pkg/, the surface a front end reads, and left to judgement
      # elsewhere: client/ mirrors the meshObject API, which documents itself.
      - linters:
          - revive
        text: "^exported:"
        path-except: (^|/)pkg/
      - linters:
          - revive
        text: "^exported:"
        path: _test\.go
      # In test code the testing.T comes first, before a context, internal/testutil included.
      - linters:
          - revive
        text: "^context-as-argument:"
        path: (_test\.go|internal/testutil/)
      # A test api key is a fixture, not a leaked secret.
      - linters:
          - gosec
        text: G101
        path: _test\.go
      # The one package that may build a client, which is the whole point of the rule.
      - path: internal/http/
        linters:
          - forbidigo
      # Have one central place of a simple HTTP test server
      - path: internal/testutil/testserver/
        linters:
          - forbidigo
      # cmd/internal/testacc is the browser, not a caller of meshStack: it drives keycloak's HTML
      # login forms with its own cookie jar, which is the one thing internal/http cannot do for it.
      # gosec: it launches the binary under test, from a path it built itself, on purpose.
      - path: cmd/internal/testacc/
        linters:
          - forbidigo
          - gosec

  settings:
    # One HTTP client for the process, built in internal/http, and nothing else may make an
    # outbound request of its own. Use forbigo solely for this purpose, see also test exclusions above.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: \.(Client|DefaultClient|Transport|DefaultTransport|Get|Head|Post|PostForm)$
          pkg: ^net/http$
          msg: the process has one HTTP client, built in internal/http; take it from there rather than making another

    gocritic:
      disabled-checks:
        # an if-else chain that ends in a return per branch reads as it is written here
        - ifElseChain

    # The Context form, because the provider's handler reads terraform's logger out of the context
    # and drops a record without one. Messages are composed with fmt.Sprintf, so static-msg is off.
    sloglint:
      context: all
      no-mixed-args: true

    # The one alias the client/ rules ask for, so a file that needs both http packages cannot drift.
    importas:
      alias:
        - pkg: net/http
          alias: gohttp

    govet:
      enable-all: true
      disable:
        # field order follows what reads well, not what packs tightest
        - fieldalignment

    staticcheck:
      checks:
        - all
        # ST1000 wants a comment on every package, which is not where comments earn their place.
        - -ST1000
      # Replaces the default list, dropping API, HTTP, ID, JSON, SSH, URI, URL and UUID so that
      # ClientId, BaseUrl and Uuid stand as the meshObject API spells them. ST1003 still enforces
      # the rest: no underscores, no ALL_CAPS, camelCase throughout.
      initialisms: []

    godoclint:
      default: basic

    exhaustive:
      default-signifies-exhaustive: true

    nolintlint:
      require-explanation: true
      require-specific: true

    revive:
      # No default rule set: package-comments wants a comment on every package, and var-naming
      # wants the API's own field names spelled differently. exported is scoped under exclusions.
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: datarace
        - name: defer
        - name: early-return
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: identical-branches
        - name: modifies-value-receiver
        - name: range-val-address
        - name: receiver-naming
        - name: redundant-import-alias
        - name: string-of-int
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unused-parameter
        - name: unexported-return
        - name: unnecessary-stmt
        - name: use-any
        - name: waitgroup-by-value

    depguard:
      rules:

        # cmd/ builds the command tree, and is the only place cobra is used.
        cmd:
          files:
            - "**/cmd/*.go"
            - "**/cmd/**/*.go"
            - "!**/cmd/meshstack/*.go"
            - "!**/cmd/internal/*.go"
            - "!$test"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Use log/slog instead
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            - log/slog
            # no direct access to internal/
            - github.com/meshcloud/meshstack-cli/pkg
            # a parent command calls its children's New, the same way cmd/meshstack calls its own
            - github.com/meshcloud/meshstack-cli/cmd
            - github.com/meshcloud/meshstack-cli/client
            # keep this list short (ideally only cobra)
            - github.com/spf13/cobra

        cmd-meshstack:
          files:
            - "**/cmd/meshstack/*.go"
            - "!$test"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Use log/slog instead
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            - log/slog
            - github.com/meshcloud/meshstack-cli/cmd
            - github.com/meshcloud/meshstack-cli/pkg/io
            # Keep this list short
            - github.com/spf13/cobra
            - github.com/charmbracelet/log

        cmd-internal:
          files:
            - "**/cmd/internal/*.go"
            - "!$test"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Use log/slog instead
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            - log/slog
            - github.com/meshcloud/meshstack-cli/pkg
            - github.com/meshcloud/meshstack-cli/client
            # A command writes the same objects the client sends, so it marshals them the same
            # way: deterministic member order, and a nil slice or map as null.
            - github.com/meshcloud/meshstack-cli/internal/json
            # Keep this list short
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/goccy/go-yaml

        # The package the Terraform provider consumes most directly.
        client:
          files:
            # Both patterns are needed: '**/dir/**/*.go' only matches files in
            # subdirectories of dir, never files directly inside it.
            - "**/client/*.go"
            - "**/client/**/*.go"
            - "!$test"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Use log/slog instead
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            # the v1 deny above is a prefix match, so the two v2 paths are re-allowed by name
            - encoding/json/v2
            - encoding/json/jsontext
            - log/slog
            - github.com/meshcloud/meshstack-cli/client
            - github.com/meshcloud/meshstack-cli/internal/http
            # every request body this package builds has to keep v1's wire shape, and
            # internal/json is the only place that bundle lives
            - github.com/meshcloud/meshstack-cli/internal/json
            - github.com/meshcloud/meshstack-cli/internal/version

        pkg:
          files:
            - "**/pkg/**/*.go"
            - "!$test"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Use log/slog instead
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            - log/slog
            - github.com/meshcloud/meshstack-cli/client
            - github.com/meshcloud/meshstack-cli/pkg
            - github.com/meshcloud/meshstack-cli/internal

        # as client depends on internal/http, also do not leak anything else than $gostd into it.
        # internal/json shares this rule because internal/http does its JSON through it, so
        # whatever internal/json may import, client gets: one constraint, one list to widen.
        internal-http:
          files:
            - "**/internal/http/*.go"
            - "**/internal/json/*.go"
            - "!$test"
          list-mode: strict
          deny:
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            # the v1 deny above is a prefix match, so the two v2 paths are re-allowed by name
            - encoding/json/v2
            - encoding/json/jsontext
            - github.com/meshcloud/meshstack-cli/internal/json

        # client depends on internal/version too, so the same rule holds: anything that needs
        # more than $gostd to work with a version belongs in internal/update instead. No JSON
        # either: a Version goes on the wire through MarshalText, so encoding alone is enough.
        internal-version:
          files:
            - "**/internal/version/*.go"
            - "!$test"
          list-mode: strict
          deny:
            - pkg: encoding/json # every version of it, `encoding` alone carries a Version
              desc: Marshal a Version through its MarshalText, and keep JSON out of here
          allow:
            - $gostd

        internal:
          files:
            - "**/internal/**/*.go"
            - "!$test"
            - "!**/internal/testutil/**/*.go"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Use log/slog instead
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            # the v1 deny above is a prefix match, so the two v2 paths are re-allowed by name
            - encoding/json/v2
            - encoding/json/jsontext
            - log/slog
            - github.com/meshcloud/meshstack-cli/internal
            # internal/auth builds a client, and the types a profile stores are client/types ones
            - github.com/meshcloud/meshstack-cli/client
            # Keep this list of external libraries as small as possible!
            # Never add cobra here!
            - github.com/gofrs/flock

        internal-test:
          files:
            - "**/internal/testutil/**/*.go"
          list-mode: strict
          deny:
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            # the v1 deny above is a prefix match, so the two v2 paths are re-allowed by name
            - encoding/json/v2
            - encoding/json/jsontext
            - github.com/meshcloud/meshstack-cli
            # Using testify is ok in testutil
            - github.com/stretchr/testify

        # Tests may additionally use testify, which is what the client's moved tests
        # are written against. The v1 deny is here as well as on every rule above, because a test
        # that pins a wire format with v1 pins a format this module no longer produces.
        tests:
          files:
            - "$test"
          list-mode: strict
          deny:
            - pkg: encoding/json # v1, which $gostd's `encoding` entry would otherwise allow
              desc: Use encoding/json/v2 and internal/json instead
          allow:
            - $gostd
            # the v1 deny above is a prefix match, so the two v2 paths are re-allowed by name
            - encoding/json/v2
            - encoding/json/jsontext
            - github.com/meshcloud/meshstack-cli
            # more a less the union of hand-picked external libs
            - github.com/spf13/cobra
            - github.com/stretchr/testify
            - github.com/gofrs/flock
