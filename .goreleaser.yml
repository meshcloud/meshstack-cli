version: 2

# Everything published carries the repository name, while the binary inside it is
# meshstack, which is why the build below names the binary explicitly.
project_name: meshstack-cli

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/meshstack
    binary: meshstack
    env:
      # A statically linked binary runs in the distroless image and on any glibc version.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    # The Dockerfile and flake.nix set the same ldflag, and all three have to agree. The
    # linker ignores an -X whose path does not resolve and warns about nothing, so a stale
    # path here is silent.
    ldflags:
      # .Tag, not .Version: the latter strips the leading v, and every version this binary
      # reports carries it.
      - '-s -w -X github.com/meshcloud/meshstack-cli/cmd/internal.Version={{ .Tag }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    # The Terraform provider imports client/, and while the CLI is at 0.x a breaking change takes no
    # `!`. This group is where the provider's maintainers find what they have to adapt to.
    - title: Client API
      regexp: '^(feat|fix|refactor|perf)\(client\)!?:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 2
    - title: Others
      order: 99

# Opens a pull request to microsoft/winget-pkgs. The pull request comes from the fork
# jannymeshi/winget-pkgs, because goreleaser has to push the manifest branch somewhere, and a bot
# account keeps that fork out of the meshcloud organization. One-time setup:
#   - the GitHub user jannymeshi owns the fork jannymeshi/winget-pkgs;
#   - the repository secret JANNYMESHI_WINGET_PKGS_TOKEN holds a classic personal access token
#     of jannymeshi with the public_repo scope, and release.yml passes it in;
#   - jannymeshi signs the Microsoft CLA once, with company "meshcloud", when the CLA bot asks on
#     the first pull request.
# Microsoft reviews every pull request, so a release reaches winget only once that review merges it.
winget:
  - name: meshstack-cli
    package_identifier: meshcloud.meshstack-cli
    publisher: meshcloud
    publisher_url: https://www.meshcloud.io
    short_description: Command-line interface for meshStack
    license: Apache-2.0
    license_url: https://github.com/meshcloud/meshstack-cli/blob/main/LICENSE
    homepage: https://github.com/meshcloud/meshstack-cli
    release_notes_url: https://github.com/meshcloud/meshstack-cli/releases/tag/{{ .Tag }}
    tags:
      - meshstack
      - meshcloud
      - cli
      - cloud
    # release.yml runs only for tags without a prerelease suffix today. If that changes, this still
    # keeps a prerelease out of the package.
    skip_upload: auto
    commit_author:
      name: jannymeshi
      email: 253058105+jannymeshi@users.noreply.github.com
    repository:
      owner: jannymeshi
      name: winget-pkgs
      branch: '{{ .ProjectName }}-{{ .Version }}'
      token: '{{ .Env.JANNYMESHI_WINGET_PKGS_TOKEN }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
