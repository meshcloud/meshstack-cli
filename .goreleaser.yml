version: 2

# Everything published carries the repository name, while the binary inside it is
# meshstack, which is why the build below names the binary explicitly.
project_name: meshstack-cli

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/meshstack
    binary: meshstack
    env:
      # A statically linked binary runs in the distroless image and on any glibc version.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    # The Dockerfile and flake.nix set the same ldflag, and all three have to agree. The
    # linker ignores an -X whose path does not resolve and warns about nothing, so a stale
    # path here is silent.
    ldflags:
      # .Tag, not .Version: the latter strips the leading v, and every version this binary
      # reports carries it.
      - '-s -w -X github.com/meshcloud/meshstack-cli/cmd/internal.Version={{ .Tag }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Others
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
